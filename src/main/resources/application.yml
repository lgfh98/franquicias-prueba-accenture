server:
  port: 8080

spring:
  application:
    name: franchise-api

  datasource:
    url: jdbc:h2:mem:franchises;MODE=PostgreSQL
    username: sa
    password:

  h2:
    console:
      enabled: true

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true

  sql:
    init:
      mode: embedded